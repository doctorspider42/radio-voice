# Builds Windows and macOS installers on main, codex branches and pull requests.
# Only main publishes a release, after both application builds succeed.
#
# The version comes from the VERSION file, never from this workflow. A push
# whose version already has a tag still builds - the artifact is uploaded and
# can be downloaded from the run - it just does not publish a second release
# over the first. Bumping VERSION is what turns a push into a release, which is
# why CLAUDE.md asks for it on every change.

name: Release

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Matches the ids in driver/README.md, so the two cannot drift apart.
  WDK_VERSION: "10.0.26100"

jobs:
  # ---------------------------------------------------------------------------
  # The driver, which is optional in every sense: the installer is perfectly
  # usable without it, and this job is allowed to fail without taking the
  # release with it.
  #
  # It is separate rather than inline because installing the WDK takes minutes
  # and is the least reliable thing here - a runner image change breaks this and
  # nothing else.
  # ---------------------------------------------------------------------------
  driver:
    name: Driver (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install the Windows SDK and WDK
        run: |
          winget install --id Microsoft.WindowsSDK.${{ env.WDK_VERSION }} --exact `
            --accept-source-agreements --accept-package-agreements --disable-interactivity
          winget install --id Microsoft.WindowsWDK.${{ env.WDK_VERSION }} --exact `
            --accept-source-agreements --accept-package-agreements --disable-interactivity

      - name: Build
        run: .\driver\build.ps1 -Configuration Release

      # The certificate is generated here and thrown away with the runner. What
      # reaches the user is only the public .cer, and the key that signed it no
      # longer exists anywhere by the time they install it.
      #
      # This is still a certificate the user's machine is asked to trust, which
      # is why the installer stops and says so in as many words.
      - name: Create a signing certificate
        run: .\driver\tools\make-test-cert.ps1

      - name: Sign
        run: .\driver\tools\sign.ps1

      - name: Stage the payload
        run: .\installer\stage-driver.ps1 -Configuration Release -Clean

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: driver-payload
          path: installer/payload/driver
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The application and the installer. This one is not allowed to fail.
  # ---------------------------------------------------------------------------
  installer:
    name: Installer
    runs-on: windows-latest
    needs: driver
    # `always()` so that a failed driver job produces an application-only
    # installer instead of no installer at all.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION does not hold a semantic version: '$version'"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version"    >> $env:GITHUB_OUTPUT

      # MinGW, which is what build.cmd defaults to and the only toolchain the
      # dependencies currently build under - the msvc preset does not survive
      # rnnoise's SSE4.1 flags or the VST3 SDK's char8_t usage. Releasing with
      # the same compiler the project is developed with is the right default
      # anyway; a release should not be the first time a toolchain is tried.
      - name: Install the toolchain
        run: choco install mingw ninja --no-progress --yes

      - name: Build the application
        run: .\build.cmd

      # Optional, and absent whenever the driver job did not finish.
      - name: Fetch the driver payload
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: driver-payload
          path: installer/payload/driver

      # winget, not choco: the Chocolatey `innosetup` package is still 6.x, and
      # the script needs 7 for SetupArchitecture=x64.
      - name: Install Inno Setup 7
        run: |
          winget install --id JRSoftware.InnoSetup.7 --exact `
            --accept-source-agreements --accept-package-agreements --disable-interactivity

      # build\bin is where the .iss looks by default, so there is nothing to
      # pass here.
      - name: Build the installer
        shell: pwsh
        run: |
          if (-not (Test-Path 'build\bin\RadioVoice.exe')) {
            throw "build\bin\RadioVoice.exe not found - the build step produced nothing"
          }

          # Where ISCC lands depends on how Inno Setup was installed, and a
          # runner image change is enough to move it. Version 7 only - a 6 found
          # here would fail on SetupArchitecture with a less obvious message.
          $candidates = @(
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe"
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe"
            "$env:LOCALAPPDATA\Programs\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup 7's ISCC.exe not found in: $($candidates -join '; ')" }

          & $iscc installer\RadioVoice.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: RadioVoice-${{ steps.version.outputs.version }}-setup
          path: dist/*.exe
          if-no-files-found: error


  macos:
    name: macOS universal DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packaging tools
        run: |
          command -v ninja || brew install ninja
          python -m pip install -r installer/macos/requirements.txt

      - name: Configure signing
        id: signing
        env:
          CERTIFICATE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_P12_BASE64 || '' }}
          CERTIFICATE_PASSWORD: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          EXPECTED_IDENTITY: ${{ vars.MACOS_CODESIGN_IDENTITY }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo '::notice::No macOS signing certificate configured. Building an explicitly unsigned development preview.'
            echo 'identity=-' >> "$GITHUB_OUTPUT"
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/radiovoice-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "RV_CI_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -nE 's/.* ([A-F0-9]{40}) "Developer ID Application:.*$/\1/p' | head -1)
          test -n "$identity" || { echo '::error::No valid Developer ID Application identity in the supplied certificate'; exit 1; }
          if [ -n "$EXPECTED_IDENTITY" ] && [ "$identity" != "$EXPECTED_IDENTITY" ]; then
            echo '::error::The imported certificate does not match MACOS_CODESIGN_IDENTITY'
            exit 1
          fi
          rm "$RUNNER_TEMP/certificate.p12"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
          echo 'signed=true' >> "$GITHUB_OUTPUT"

      - name: Build Apple Silicon and Intel slices
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          cmake --preset macos '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' "-DRV_CODESIGN_IDENTITY=$SIGNING_IDENTITY"
          cmake --build --preset macos --parallel 3
          lipo -verify_arch arm64 x86_64 build-macos/bin/RadioVoice.app/Contents/MacOS/RadioVoice

      - name: Verify portable audio and packaging logic
        run: |
          ctest --test-dir build-macos --output-on-failure -E macos_audio_playback
          python -m unittest discover -s tests -p 'test_macos_packaging.py'

      - name: Package the installer
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = true ]; then
            python tools/package_macos.py --identity "$SIGNING_IDENTITY"
          else
            python tools/package_macos.py --unsigned
          fi

      - name: Upload the macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: RadioVoice-macos-universal
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${RV_CI_KEYCHAIN:-}" ]; then security delete-keychain "$RV_CI_KEYCHAIN"; fi
          rm -f "$RUNNER_TEMP/certificate.p12"

  publish:
    name: Publish Windows and macOS
    runs-on: ubuntu-latest
    needs: [installer, macos]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect the installers
        uses: actions/download-artifact@v4
        with:
          pattern: RadioVoice-*
          merge-multiple: true
          path: dist

      - name: Prepare release metadata
        id: version
        run: |
          python tools/release_notes.py --output release-notes.md
          echo "tag=v$(cat VERSION | tr -d '\r\n')" >> "$GITHUB_OUTPUT"

      - name: Publish once all required builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::$RELEASE_TAG is already released; bump VERSION to publish a new one."
            exit 0
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --title "RadioVoice $RELEASE_TAG" \
            --notes-file release-notes.md --target "$GITHUB_SHA"
